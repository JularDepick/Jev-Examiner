# 将 src/pages 下的静态内容部署到 GitHub Pages
name: 部署 src/pages 到 Pages
on:
  push:
    branches: ["main"]
    paths:
      - 'src/pages/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
      - name: 配置Pages环境
        uses: actions/configure-pages@v5
      - name: 上传内容
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src/pages'
      - name: 部署到Pages
        id: deployment
        uses: actions/deploy-pages@v5
